<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hangman Game JavaScript</title>
  <link rel="stylesheet" href="style.css" />
  <script src="scripts/word-list.js" defer></script>
  <script src="scripts/script.js" defer></script>
</head>
<body>
  <!-- 🔊 Background Music (hidden player) -->
  <audio id="bg-music" src="mexican-standoff.mp3" loop preload="auto"></audio>

  <div class="wrapper">
    <h1 class="page-title">Hangman</h1>

    <div class="game-modal">
      <div class="content">
        <img src="#" alt="gif" />
        <h4>Game Over!</h4>
        <p>The correct word was: <b>rainbow</b></p>
        <button class="play-again">Play Again</button>
      </div>
    </div>

    <div class="container">
      <div class="hangman-box">
        <img src="#" draggable="false" alt="hangman-img" />
        <h1>Hangman Game</h1>
      </div>
      <div class="game-box">
        <ul class="word-display"></ul>
        <h4 class="hint-text">Hint: <b></b></h4>
        <h4 class="guesses-text">Incorrect guesses: <b></b></h4>
        <div class="keyboard"></div>
      </div>
    </div>
  </div>

  <!-- ✅ Script to enable music after first click -->
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const bgMusic = document.getElementById("bg-music");
      bgMusic.volume = 0.1;

      // Enable music on first user interaction
      const startMusic = () => {
        bgMusic.play().catch((e) => console.warn("Autoplay failed:", e));
        document.removeEventListener("click", startMusic);
      };

      document.addEventListener("click", startMusic);
    });
  </script>
</body>
</html>
