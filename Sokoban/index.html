<!DOCTYPE html>

  <style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;

    background: linear-gradient(135deg, #c4b896 0%, #a19555 50%, #8b7d3a 100%);

    touch-action: none;
    -webkit-touch-action: none;
    -ms-touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -ms-user-select: none;
    -moz-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px;
  }

  .game-container {
    background: rgba(222, 214, 174, 0.9);
    backdrop-filter: blur(10px);

    max-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    margin-bottom: 15px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .game-info {
    display: flex;
    gap: 20px;
    align-items: center;
    flex-wrap: wrap;
  }

  .info-item {
    color: #5b5530;
    font-weight: bold;
    text-shadow: 0 1px 2px rgba(255, 255, 255, 0.3);
    font-size: 16px;
  }

  .info-value {
    color: #914430;
    text-shadow: 0 0 8px rgba(145, 68, 48, 0.3);
  }

  .game-controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .control-btn {
    background: linear-gradient(145deg, #a19555, #8b7d3a);
    border: 2px solid #5b5530;
    border-radius: 10px;
    color: #ded6ae;
    font-weight: bold;
    padding: 8px 16px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(91, 85, 48, 0.3);
    font-size: 14px;
    touch-action: manipulation;
    user-select: none;
  }

    background: linear-gradient(145deg, #b5a666, #9c8e4b);
  }

  .control-btn:active {

    box-shadow: 0 2px 10px rgba(91, 85, 48, 0.3);
  }

    border-radius: 15px;
    box-shadow: 0 8px 25px rgba(91, 85, 48, 0.4);
    border: 3px solid rgba(161, 149, 85, 0.8);
    background: #ded6ae;

    -webkit-touch-action: none;
    -ms-touch-action: none;
    user-select: none;
    -webkit-touch-callout: none;
    pointer-events: auto;
  }

    display: none;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-top: 20px;
    width: 200px;
    height: 200px;
  }

  .mobile-btn {
    background: linear-gradient(145deg, rgba(161, 149, 85, 0.8), rgba(139, 125, 58, 0.6));
    border: 2px solid rgba(91, 85, 48, 0.8);
    border-radius: 15px;
    color: #ded6ae;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    text-shadow: 0 2px 4px rgba(91, 85, 48, 0.8);

    user-select: none;

  }

  .mobile-btn:nth-child(1) { grid-column: 1; grid-row: 2; } /* Left */

  wallCtx.fillRect(0, 0, grid, grid);
  wallCtx.fillStyle = '#a19555';

  // 1st row brick

  // 2nd row bricks
  wallCtx.fillRect(0, 23 * scale, 20 * scale, 18 * scale);
  wallCtx.fillRect(22 * scale, 23 * scale, 42 * scale, 18 * scale);
  
  // 3rd row bricks
  wallCtx.fillRect(0, 43 * scale, 42 * scale, 20 * scale);
  wallCtx.fillRect(44 * scale, 43 * scale, 20 * scale, 20 * scale);
}

// Validate level design to ensure solvability
function validateLevel(levelString) {
  const lines = levelString.split('\n').filter(line => line.trim());
  let boxCount = 0;
  let targetCount = 0;
  let playerCount = 0;
  let corners = [];
  
  // Count elements and find corners
  for (let row = 0; row < lines.length; row++) {
    for (let col = 0; col < lines[row].length; col++) {
      const cell = lines[row][col];
      
      if (cell === '$') boxCount++;
      if (cell === '.') targetCount++;
      if (cell === '@' || cell === '+') playerCount++;
      if (cell === '*') { boxCount++; targetCount++; } // box on goal
      
      // Check if this is a corner (surrounded by walls on two adjacent sides)
      if (cell === '$' || cell === '.') {
        const isTopWall = row === 0 || lines[row-1][col] === '#';
        const isBottomWall = row === lines.length-1 || lines[row+1][col] === '#';
        const isLeftWall = col === 0 || lines[row][col-1] === '#';
        const isRightWall = col === lines[row].length-1 || lines[row][col+1] === '#';
        
        if ((isTopWall && isLeftWall) || (isTopWall && isRightWall) || 
            (isBottomWall && isLeftWall) || (isBottomWall && isRightWall)) {
          corners.push({row, col, cell});
        }
      }
    }
  }
  
  // Validation checks
  const issues = [];
  
  if (boxCount !== targetCount) {
    issues.push(`Box-Target mismatch: ${boxCount} boxes, ${targetCount} targets`);
  }
  
  if (playerCount !== 1) {
    issues.push(`Player count error: ${playerCount} players (should be 1)`);
  }
  
  // Check for boxes in corners without targets
  corners.forEach(corner => {
    if (corner.cell === '$') {
      issues.push(`Box in corner at (${corner.row}, ${corner.col}) - potential deadlock`);
    }
  });
  
  // Check for 2x2 box clusters (major deadlock risk)
  for (let row = 0; row < lines.length - 1; row++) {
    for (let col = 0; col < lines[row].length - 1; col++) {
      if (lines[row][col] === '$' && 
          lines[row][col + 1] === '$' && 
          lines[row + 1] && lines[row + 1][col] === '$' && 
          lines[row + 1][col + 1] === '$') {
        issues.push(`2x2 box cluster at (${row}, ${col}) - impossible to separate`);
      }
    }
  }
  
  // Check for wall deadlocks (boxes against walls with no escape)
  for (let row = 0; row < lines.length; row++) {
    for (let col = 0; col < lines[row].length; col++) {
      if (lines[row][col] === '$') {
        const isAgainstBottomWall = row === lines.length - 2 && lines[lines.length - 1][col] === '#';
        const isAgainstTopWall = row === 1 && lines[0][col] === '#';
        const isAgainstLeftWall = col === 1 && lines[row][0] === '#';
        const isAgainstRightWall = col === lines[row].length - 2 && lines[row][lines[row].length - 1] === '#';
        
        // Check if box is against wall with limited mobility
        if (isAgainstBottomWall || isAgainstTopWall || isAgainstLeftWall || isAgainstRightWall) {
          // Check if there are targets accessible from this wall position
          let hasAccessibleTarget = false;
          for (let tRow = 0; tRow < lines.length; tRow++) {
            for (let tCol = 0; tCol < lines[tRow].length; tCol++) {
              if (lines[tRow][tCol] === '.') {
                // Simple accessibility check - target should be reachable
                if ((isAgainstBottomWall && tRow < row) || 
                    (isAgainstTopWall && tRow > row) ||
                    (isAgainstLeftWall && tCol > col) ||
                    (isAgainstRightWall && tCol < col)) {
                  hasAccessibleTarget = true;
                  break;
                }
              }
            }
            if (hasAccessibleTarget) break;
          }
          
          if (!hasAccessibleTarget) {
            issues.push(`Box at (${row}, ${col}) against wall with no accessible targets`);
          }
        }
      }
    }
  }
  
  return {
    valid: issues.length === 0,
    issues: issues,
    stats: { boxes: boxCount, targets: targetCount, players: playerCount }
  };
}

// Validate all levels on startup
function validateAllLevels() {
  console.log('🔍 VALIDATING ALL SOKOBAN LEVELS...');
  
  const difficulties = ['Easy', 'Medium', 'Hard'];
  const levelSets = [easyLevels, mediumLevels, hardLevels];
  
  let totalIssues = 0;
  
  levelSets.forEach((levels, diffIndex) => {
    console.log(`\n📋 ${difficulties[diffIndex]} Levels:`);
    
    levels.forEach((level, levelIndex) => {
      const validation = validateLevel(level);
      const levelNum = levelIndex + 1;
      
      if (validation.valid) {
        console.log(`✅ Level ${levelNum}: ${validation.stats.boxes} boxes, ${validation.stats.targets} targets`);
      } else {
        console.error(`❌ Level ${levelNum} ISSUES:`, validation.issues);
        totalIssues += validation.issues.length;
      }
    });
  });
  
  if (totalIssues === 0) {
    console.log('\n🎉 ALL LEVELS VALIDATED SUCCESSFULLY! No deadlocks or mismatches found.');
  } else {
    console.error(`\n⚠️ FOUND ${totalIssues} ISSUES ACROSS ALL LEVELS`);
  }
  
  return totalIssues === 0;
}

// Generate shuffled level order within each difficulty
function generateShuffledLevelOrder() {
  levelOrder = [];
  
  // Create arrays for each difficulty
  const easyIndices = Array.from({length: 10}, (_, i) => i);
  const mediumIndices = Array.from({length: 10}, (_, i) => i + 10);
  const hardIndices = Array.from({length: 10}, (_, i) => i + 20);
  
  // Shuffle function
  function shuffle(array) {
    const shuffled = [...array];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
  }
  
  // Add shuffled levels within each difficulty: easy -> medium -> hard
  levelOrder = [
    ...shuffle(easyIndices),    // Levels 1-10: shuffled easy layouts
    ...shuffle(mediumIndices),  // Levels 11-20: shuffled medium layouts
    ...shuffle(hardIndices)     // Levels 21-30: shuffled hard layouts
  ];
  
  completedLevels = 0;
  console.log('Generated shuffled level order within difficulties:', levelOrder);
}

// Game state
let cells = [];
let originalCells = [];

// Load a specific level
function loadLevel(levelIndex) {
  if (levelIndex < 0 || levelIndex >= levelOrder.length) return false;
  
  currentLevel = levelIndex;
  const actualLevelIndex = levelOrder[levelIndex];
  moveCount = 0;
  gameWon = false; // Ensure game is not in won state
  boxesOnGoalsCount = 0;
  moveHistory = []; // Clear move history
  width = 0;
  cells = [];
  
  // Reset any ongoing animation frame
  if (rAF) {
    cancelAnimationFrame(rAF);
    rAF = null;
  }
  
  // Parse level data
  const levelString = allLevels[actualLevelIndex];
  
  levelString.split('\n')
    .filter(rowData => !!rowData.trim()) // Filter out empty lines
    .forEach((rowData, row) => {
      cells[row] = [];
      
      if (rowData.length > width) {
        width = rowData.length;
      }
      
      rowData.split('').forEach((colData, col) => {
        cells[row][col] = colData;
        
        if (colData === types.player || colData === types.playerOnGoal) {
          playerPos = { row, col };
        }
      });
    });
  
  // Normalize row widths by padding with empty spaces to avoid movement OOB issues
  for (let r = 0; r < cells.length; r++) {
    const rowArr = cells[r] || [];
    if (rowArr.length < width) {
      for (let c = rowArr.length; c < width; c++) {
        rowArr[c] = types.empty;
      }
      cells[r] = rowArr;
    }
  }
  
  // Calculate optimal grid size based on level dimensions and viewport
  const maxCanvasWidth = Math.min(window.innerWidth - 100, 800);
  const maxCanvasHeight = Math.min(window.innerHeight - 350, 600);
  
  const gridByWidth = Math.floor(maxCanvasWidth / width);
  const gridByHeight = Math.floor(maxCanvasHeight / cells.length);
  
  // Use the smaller grid size to ensure everything fits, with min 48 and max 64
  grid = Math.max(48, Math.min(64, Math.min(gridByWidth, gridByHeight)));
  
  // Regenerate wall canvas at new grid size
  generateWallCanvas();
  
  // Store original state for reset
  originalCells = cells.map(row => [...row]);
  
  // Update canvas size
  canvas.width = width * grid;
  canvas.height = cells.length * grid;
  
  // Update UI
  updateUI();
  
  // Ensure game loop is running
  if (!rAF && !gameWon) {
    requestAnimationFrame(loop);
  }
  
  return true;
}

// Scoring system
function calculateScore(levelIndex, moves) {
  // Base score depends on level difficulty
  let baseScore;
  if (levelIndex < 10) {
    baseScore = 1000; // Easy levels
  } else if (levelIndex < 20) {
    baseScore = 1500; // Medium levels
  } else {
    baseScore = 2000; // Hard levels
  }
  
  // Bonus for efficient completion (fewer moves = higher score)
  const optimalMoves = Math.max(10, Math.floor(baseScore / 100));
  const efficiency = Math.max(0.1, optimalMoves / Math.max(moves, optimalMoves));
  
  return Math.floor(baseScore * efficiency);
}

// Timer functions
function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  
  timerInterval = setInterval(() => {
    if (gameOver) return;
    
    timeRemaining--;
    updateTimerDisplay();
    
    if (timeRemaining <= 0) {
      handleGameOver();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const minutes = Math.floor(timeRemaining / 60);
  const seconds = timeRemaining % 60;
  timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
  
  // Change color when time is running out
  if (timeRemaining <= 30) {
    timerDisplay.style.color = '#ff0000';
  } else if (timeRemaining <= 60) {
    timerDisplay.style.color = '#ff8800';
  } else {
    timerDisplay.style.color = '#914430';
  }
}

function handleGameOver() {
  gameOver = true;
  clearInterval(timerInterval);
  
  if (rAF) {
    cancelAnimationFrame(rAF);
    rAF = null;
  }
  
  // Show game over overlay with blur
  const gameOverOverlay = document.getElementById('game-over-overlay');
  gameOverOverlay.style.display = 'flex';
  
  // Send game over message to parent
  setTimeout(() => {
    window.parent.postMessage({ type: "GAME_OVER", score: totalScore }, "*");
  }, 500);
}

// Update UI displays
function updateUI() {
  levelDisplay.textContent = currentLevel + 1;
  scoreDisplay.textContent = totalScore;
  movesDisplay.textContent = moveCount;
  updateTimerDisplay();
}

// move an entity from one cell to another
function move(startPos, endPos) {
  const startCell = cells[startPos.row][startPos.col];
  const endCell = cells[endPos.row][endPos.col];

  const isPlayer = startCell === types.player || startCell === types.playerOnGoal;
  
  // Track if a box is being removed from a goal
  const wasBoxOnGoal = startCell === types.blockOnGoal;

  // first remove then entity from its current cell
  switch(startCell) {

    // if the start cell is the player or a block (no goal)
    // then leave empty
    case types.player:
    case types.block:
      cells[startPos.row][startPos.col] = types.empty;
      break;

    // if the start cell has a goal then leave a goal
    case types.playerOnGoal:
    case types.blockOnGoal:
      cells[startPos.row][startPos.col] = types.goal;
      if (wasBoxOnGoal) {
        boxesOnGoalsCount--;
        totalScore -= 25; // Remove points when box leaves goal
      }
      break;
  }

  // then move then entity into the new cell
  switch(endCell) {

    // if the end cell is empty, add the block or player
    case types.empty:
      cells[endPos.row][endPos.col] = isPlayer ? types.player : types.block;
      break;

    // if the cell has a goal then make sure to preserve the goal
    case types.goal:
      cells[endPos.row][endPos.col] = isPlayer ? types.playerOnGoal : types.blockOnGoal;
      if (!isPlayer) {
        boxesOnGoalsCount++;
        totalScore += 25; // Add 25 points when box is placed on goal
      }
      break;
  }
}

// Auto-advance to next level (no overlay)
function showWin() {
  if (gameWon) {
    console.log('showWin called but game already won, ignoring...');
    return; // Prevent multiple calls
  }
  
  gameWon = true;
  cancelAnimationFrame(rAF);
  
  // Calculate and add score for this level
  const levelScore = calculateScore(currentLevel, moveCount);
  totalScore += levelScore;
  
  // Show brief completion flash
  canvas.style.filter = 'brightness(1.3) saturate(1.5)';
  
  // Brief pause then auto-advance to next level
  setTimeout(() => {
    canvas.style.filter = 'none'; // Remove flash effect
    
    if (currentLevel < levelOrder.length - 1) {
      loadLevel(currentLevel + 1);
    } else {
      // Game completed - restart with new shuffled order
      generateShuffledLevelOrder();
      loadLevel(0);
    }
  }, 800); // 0.8 second pause with visual feedback
}

// Reset current level
function resetLevel() {
  if (originalCells.length === 0 || gameOver) return;
  
  // Apply 15 second time penalty
  timeRemaining = Math.max(0, timeRemaining - 15);
  updateTimerDisplay();
  
  if (timeRemaining <= 0) {
    handleGameOver();
    return;
  }
  
  cells = originalCells.map(row => [...row]);
  moveCount = 0;
  gameWon = false;
  moveHistory = []; // Clear move history
  boxesOnGoalsCount = 0;
  
  // Recalculate initial boxes on goals
  for (let row = 0; row < cells.length; row++) {
    for (let col = 0; col < cells[row].length; col++) {
      if (cells[row][col] === types.blockOnGoal) {
        boxesOnGoalsCount++;
      }
    }
  }
  
  // Find player position
  for (let row = 0; row < cells.length; row++) {
    for (let col = 0; col < cells[row].length; col++) {
      if (cells[row][col] === types.player || cells[row][col] === types.playerOnGoal) {
        playerPos = { row, col };
        break;
      }
    }
  }
  
  updateUI();
  
  if (!rAF) {
    requestAnimationFrame(loop);
  }
}

// Undo last move
function undoMove() {
  if (moveHistory.length === 0 || gameOver || gameWon) return;
  
  // Apply 5 second time penalty
  timeRemaining = Math.max(0, timeRemaining - 5);
  updateTimerDisplay();
  
  if (timeRemaining <= 0) {
    handleGameOver();
    return;
  }
  
  // Get last state from history
  const lastState = moveHistory.pop();
  
  // Restore state
  cells = lastState.cells.map(row => [...row]);
  playerPos = { ...lastState.playerPos };
  moveCount = lastState.moveCount;
  boxesOnGoalsCount = lastState.boxesOnGoalsCount;
  totalScore = lastState.totalScore;
  
  updateUI();
}

// Handle player movement
function handleMovement() {
  if (gameWon || gameOver || (playerDir.row === 0 && playerDir.col === 0)) return;
  
  const row = playerPos.row + playerDir.row;
  const col = playerPos.col + playerDir.col;
  
  // Check bounds
  if (row < 0 || row >= cells.length || col < 0 || col >= cells[row].length) {
    return;
  }
  
  const cell = cells[row][col];
  let moved = false;
  
  // Save state before move for undo
  const stateBefore = {
    cells: cells.map(row => [...row]),
    playerPos: { ...playerPos },
    moveCount: moveCount,
    boxesOnGoalsCount: boxesOnGoalsCount,
    totalScore: totalScore
  };
  
  switch(cell) {
    case types.empty:
    case types.goal:
      move(playerPos, { row, col });
      playerPos.row = row;
      playerPos.col = col;
      moved = true;
      break;
      
    case types.wall:
      break;
      
    case types.block:
    case types.blockOnGoal:
      const nextRow = row + playerDir.row;
      const nextCol = col + playerDir.col;
      
      // Check bounds for next position
      if (nextRow >= 0 && nextRow < cells.length && 
          nextCol >= 0 && nextCol < cells[nextRow].length) {
        const nextCell = cells[nextRow][nextCol];
        
        if (nextCell === types.empty || nextCell === types.goal) {
          move({ row, col }, { row: nextRow, col: nextCol });
          move(playerPos, { row, col });
          playerPos.row = row;
          playerPos.col = col;
          moved = true;
        }
      }
      break;
  }
  
  if (moved) {
    // Add state to history for undo
    moveHistory.push(stateBefore);
    
    // Limit history to last 50 moves to save memory
    if (moveHistory.length > 50) {
      moveHistory.shift();
    }
    
    moveCount++;
    updateUI();
  }
}

// Game loop
function loop() {
  rAF = requestAnimationFrame(loop);
  context.clearRect(0, 0, canvas.width, canvas.height);
  
  // Handle movement
  handleMovement();
  
  // Reset player direction
  playerDir = { row: 0, col: 0 };

  // check to see if all blocks are on goals
  let allBlocksOnGoals = true;

  // draw the board. because multiple things can be drawn on the same
  // cell we shouldn't use a switch as that would only allow us to draw
  // a single thing per cell
  context.strokeStyle = 'black';
  context.lineWidth = 2;
  for (let row = 0; row < cells.length; row++) {
    for (let col = 0; col < cells[row].length; col++) {
      const cell = cells[row][col];

      if (cell === types.wall) {
        context.drawImage(wallCanvas, col * grid, row * grid);
      }

      if (cell === types.block || cell === types.blockOnGoal) {
        if (cell === types.block) {
          context.fillStyle = '#ffbb5b';

          // block is not on goal
          allBlocksOnGoals = false;
        }
        else {
          context.fillStyle = '#ba6a15';
        }

        context.fillRect(col * grid, row * grid, grid, grid);
        context.strokeRect(col * grid, row * grid, grid, grid);
        context.strokeRect((col + 0.1) * grid, (row + 0.1) * grid, grid - (0.2 * grid), grid - (0.2 * grid));

        // X
        context.beginPath();
        context.moveTo((col + 0.1) * grid, (row + 0.1) * grid);
        context.lineTo((col + 0.9) * grid, (row + 0.9) * grid);
        context.moveTo((col + 0.9) * grid, (row + 0.1) * grid);
        context.lineTo((col + 0.1) * grid, (row + 0.9) * grid);
        context.stroke();
      }

      if (cell === types.goal || cell === types.playerOnGoal) {
        context.fillStyle = '#914430';
        context.beginPath();
        context.arc((col + 0.5) * grid, (row + 0.5) * grid, grid * 0.15, 0, Math.PI * 2);
        context.fill();
      }

      if (cell === types.player || cell === types.playerOnGoal) {
        context.fillStyle = 'black';
        context.lineWidth = Math.max(2, grid / 24);
        
        // Scale sizes based on grid
        const headRadius = grid * 0.12;
        const bodyWidth = grid * 0.06;
        const bodyHeight = grid * 0.35;
        const armWidth = grid * 0.4;
        const armHeight = grid * 0.06;
        
        // head
        context.beginPath();
        context.arc((col + 0.5) * grid, (row + 0.3) * grid, headRadius, 0, Math.PI * 2);
        context.fill();
        
        // body
        context.fillRect((col + 0.5 - bodyWidth/2/grid) * grid, (row + 0.3) * grid, bodyWidth, bodyHeight);
        
        // arms
        context.fillRect((col + 0.3) * grid, (row + 0.48) * grid, armWidth, armHeight);
        
        // legs
        context.beginPath();
        context.moveTo((col + 0.5) * grid, (row + 0.65) * grid);
        context.lineTo((col + 0.65) * grid, (row + 0.9) * grid);
        context.moveTo((col + 0.5) * grid, (row + 0.65) * grid);
        context.lineTo((col + 0.35) * grid, (row + 0.9) * grid);
        context.stroke();
      }
    }
  }

  if (allBlocksOnGoals) {
    showWin();
  }
}

// Movement function
function movePlayer(direction) {
  if (gameWon || gameOver) return;
  
  playerDir = { row: 0, col: 0 };
  
  switch(direction) {
    case 'up':
      playerDir.row = -1;
      break;
    case 'down':
      playerDir.row = 1;
      break;
    case 'left':
      playerDir.col = -1;
      break;
    case 'right':
      playerDir.col = 1;
      break;
  }
}

// Keyboard controls
document.addEventListener('keydown', function(e) {
  e.preventDefault();
  
  switch(e.key) {
    case 'ArrowLeft':
    case 'a':
    case 'A':
      movePlayer('left');
      break;
    case 'ArrowUp':
    case 'w':
    case 'W':
      movePlayer('up');
      break;
    case 'ArrowRight':
    case 'd':
    case 'D':
      movePlayer('right');
      break;
    case 'ArrowDown':
    case 's':
    case 'S':
      movePlayer('down');
      break;
    case 'r':
    case 'R':
      resetLevel();
      break;
    case 'u':
    case 'U':
      undoMove();
      break;
  }
});

// Mobile touch controls with nuclear option
function setupMobileControls() {
  const mobileButtons = document.querySelectorAll('.mobile-btn');
  
  mobileButtons.forEach(button => {
    const direction = button.getAttribute('data-direction');
    
    // Touch events
    button.addEventListener('touchstart', (e) => {
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      movePlayer(direction);
    }, { passive: false, capture: true });
    
    // Pointer events
    button.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      movePlayer(direction);
    }, { passive: false, capture: true });
    
    // Mouse events (fallback)
    button.addEventListener('click', (e) => {
      e.preventDefault();
      movePlayer(direction);
    });
  });
}

// Control button event listeners
function setupControlButtons() {
  document.getElementById('reset-btn').addEventListener('click', resetLevel);
  document.getElementById('undo-btn').addEventListener('click', undoMove);
  // Win overlay buttons removed - game now auto-advances
}

// Touch gesture prevention
function setupTouchPrevention() {
  // Prevent default touch behaviors on canvas
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    e.stopPropagation();
  }, { passive: false, capture: true });
  
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    e.stopPropagation();
  }, { passive: false, capture: true });
  
  canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    e.stopPropagation();
  }, { passive: false, capture: true });
  
  // Global touch prevention
  document.addEventListener('touchmove', (e) => {
    e.preventDefault();
  }, { passive: false });
}

// Initialize game
function initGame() {
  // Validate all levels first
  const allValid = validateAllLevels();
  
  if (!allValid) {
    console.warn('⚠️ Some levels have issues but game will continue...');
  }
  
  setupMobileControls();
  setupControlButtons();
  setupTouchPrevention();
  generateShuffledLevelOrder();
  loadLevel(0);
  startTimer();
  requestAnimationFrame(loop);
}

// Start the game when page loads
document.addEventListener('DOMContentLoaded', initGame);
</script>
