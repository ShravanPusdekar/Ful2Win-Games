<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Run Pixie Run - WebView Integration Example</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }
        
        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        #game-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 1000;
            transition: opacity 0.5s;
        }
        
        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        #status {
            margin-top: 10px;
            font-size: 14px;
            opacity: 0.8;
        }
        
        #debug-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #0f0;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            max-width: 300px;
            z-index: 999;
            display: none;
        }
        
        #debug-panel.visible {
            display: block;
        }
        
        #debug-toggle {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid #666;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            z-index: 998;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Loading Screen -->
        <div id="loading-screen">
            <div class="loader"></div>
            <h2>Loading Run Pixie Run...</h2>
            <p id="status">Initializing game...</p>
        </div>
        
        <!-- Debug Panel -->
        <div id="debug-panel">
            <strong>🔍 WebView Debug Info</strong><br>
            <div id="debug-info"></div>
        </div>
        
        <!-- Debug Toggle Button -->
        <button id="debug-toggle">Show Debug</button>
        
        <!-- Game iframe -->
        <iframe 
            id="game-iframe"
            src="index.html"
            allow="autoplay; fullscreen; accelerometer; gyroscope; gamepad"
            allowfullscreen
            sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms allow-popups"
            loading="eager"
        ></iframe>
    </div>

    <script>
        // Configuration
        const CONFIG = {
            gameUrl: 'index.html',
            loadTimeout: 15000, // 15 seconds
            debugMode: true,
            allowedOrigins: ['http://localhost', 'https://fulboost.fun']
        };

        // State
        let gameLoaded = false;
        let gameScore = 0;

        // Elements
        const loadingScreen = document.getElementById('loading-screen');
        const statusText = document.getElementById('status');
        const gameIframe = document.getElementById('game-iframe');
        const debugPanel = document.getElementById('debug-panel');
        const debugInfo = document.getElementById('debug-info');
        const debugToggle = document.getElementById('debug-toggle');

        // Debug toggle
        debugToggle.addEventListener('click', () => {
            debugPanel.classList.toggle('visible');
            debugToggle.textContent = debugPanel.classList.contains('visible') 
                ? 'Hide Debug' 
                : 'Show Debug';
        });

        // Update status
        function updateStatus(message) {
            statusText.textContent = message;
            console.log('[WebView]', message);
        }

        // Update debug info
        function updateDebugInfo() {
            const info = {
                'User Agent': navigator.userAgent,
                'Platform': navigator.platform,
                'Screen Size': `${window.innerWidth}x${window.innerHeight}`,
                'Pixel Ratio': window.devicePixelRatio,
                'Touch Support': 'ontouchstart' in window,
                'WebGL': !!document.createElement('canvas').getContext('webgl'),
                'Audio': !!window.Audio,
                'LocalStorage': !!window.localStorage,
                'In iframe': window.self !== window.top,
                'Game Loaded': gameLoaded,
                'Current Score': gameScore
            };

            debugInfo.innerHTML = Object.entries(info)
                .map(([key, value]) => `<div>${key}: <strong>${value}</strong></div>`)
                .join('');
        }

        // Initialize
        function init() {
            updateStatus('Checking WebView capabilities...');
            updateDebugInfo();

            // Check required features
            const checks = {
                'JavaScript': true,
                'Canvas': !!document.createElement('canvas').getContext,
                'WebGL': !!document.createElement('canvas').getContext('webgl'),
                'Audio': !!window.Audio,
                'LocalStorage': (() => {
                    try {
                        return !!window.localStorage;
                    } catch(e) {
                        return false;
                    }
                })()
            };

            console.log('[WebView] Feature checks:', checks);

            // Warn about missing features
            Object.entries(checks).forEach(([feature, supported]) => {
                if (!supported) {
                    console.warn(`[WebView] ${feature} not supported!`);
                }
            });

            // Set up iframe load handler
            gameIframe.addEventListener('load', onGameLoad);
            gameIframe.addEventListener('error', onGameError);

            // Set timeout for loading
            setTimeout(() => {
                if (!gameLoaded) {
                    updateStatus('Loading timeout - check console for errors');
                    console.error('[WebView] Game failed to load within timeout');
                }
            }, CONFIG.loadTimeout);

            updateStatus('Loading game assets...');
        }

        // Game loaded
        function onGameLoad() {
            console.log('[WebView] iframe loaded');
            
            // Wait a bit for game to initialize
            setTimeout(() => {
                gameLoaded = true;
                updateStatus('Game ready!');
                
                // Hide loading screen
                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                    updateDebugInfo();
                }, 500);
            }, 2000);
        }

        // Game error
        function onGameError(error) {
            console.error('[WebView] iframe error:', error);
            updateStatus('Error loading game - check console');
            updateDebugInfo();
        }

        // Listen for messages from game
        window.addEventListener('message', function(event) {
            // Security: Verify origin
            const isAllowedOrigin = CONFIG.allowedOrigins.some(origin => 
                event.origin.includes(origin)
            ) || event.origin === window.location.origin;

            if (!isAllowedOrigin && CONFIG.debugMode) {
                console.warn('[WebView] Message from untrusted origin:', event.origin);
                return;
            }

            console.log('[WebView] Received message:', event.data);

            // Handle game events
            if (event.data && typeof event.data === 'object') {
                switch(event.data.type) {
                    case 'GAME_OVER':
                        gameScore = event.data.score || 0;
                        console.log('[WebView] Game Over! Score:', gameScore);
                        updateDebugInfo();
                        
                        // You can send this to your app
                        handleGameOver(gameScore);
                        break;
                    
                    case 'GAME_START':
                        console.log('[WebView] Game started');
                        break;
                    
                    case 'GAME_PAUSE':
                        console.log('[WebView] Game paused');
                        break;
                    
                    default:
                        console.log('[WebView] Unknown message type:', event.data.type);
                }
            }
        });

        // Handle game over
        function handleGameOver(score) {
            // Example: Send to native app (Android/iOS)
            if (window.AndroidInterface) {
                // Android
                window.AndroidInterface.onGameOver(score);
            } else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.gameHandler) {
                // iOS
                window.webkit.messageHandlers.gameHandler.postMessage({
                    type: 'GAME_OVER',
                    score: score
                });
            } else {
                // Web/Electron
                console.log('[WebView] Game Over - Score:', score);
                // You can show a modal, send to server, etc.
            }
        }

        // Prevent context menu (optional)
        document.addEventListener('contextmenu', e => e.preventDefault());

        // Prevent zoom (optional)
        document.addEventListener('gesturestart', e => e.preventDefault());
        document.addEventListener('gesturechange', e => e.preventDefault());
        document.addEventListener('gestureend', e => e.preventDefault());

        // Handle visibility change (pause/resume)
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                console.log('[WebView] App backgrounded');
                // Optionally pause game
            } else {
                console.log('[WebView] App foregrounded');
                // Optionally resume game
            }
        });

        // Update debug info periodically
        if (CONFIG.debugMode) {
            setInterval(updateDebugInfo, 2000);
        }

        // Start
        init();

        // Expose API for native apps
        window.GameAPI = {
            restart: function() {
                gameIframe.contentWindow.location.reload();
            },
            getScore: function() {
                return gameScore;
            },
            isLoaded: function() {
                return gameLoaded;
            }
        };
    </script>
</body>
</html>
