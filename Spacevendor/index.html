<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Space Invaders</title>
    <title>Space Invaders</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        /* General body styling */
        body {
            background-color: #333;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            flex-direction: column;
        }

        /* Container for the entire game */
        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 500px;
            max-height: 900px;
            overflow: hidden;
            border: 5px solid cyan;
            box-shadow: 0 0 20px cyan;
        }
        
        /* The main canvas where the game is drawn */
        canvas {
            display: block;
            background: black;
            width: 100%;
            height: 100%;
        }

        /* Overlay for start screen and game over screen */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;  /* Hidden by default - game starts immediately */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 100;
        }

        .overlay h1 {
            font-size: 3rem;
            color: #fff;
            text-shadow: 0 0 10px #fff;
        }

        .overlay p {
            font-size: 1.2rem;
            margin: 10px 0;
        }

        .overlay button {
            padding: 10px 20px;
            font-size: 1.5rem;
            cursor: pointer;
            border: 2px solid #fff;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 5px;
            margin-top: 20px;
            transition: background-color 0.3s;
        }

        .overlay button:hover {
            background-color: rgba(255, 255, 255, 0.4);
        }

        /* Scoreboard styling */
        .scoreboard {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 1.5rem;
            font-family: 'Space Mono', monospace;
            z-index: 10;
            pointer-events: none;  /* Don't block clicks */
        }

        /* Mobile controls container */
        .controls-container {
            position: absolute;
            bottom: 50px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 50;  /* Ensure controls are above canvas */
            pointer-events: none;  /* Allow clicks to pass through container */
        }

        /* Joystick styling */
        .joystick {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;  /* Enable clicks on joystick */
        }

        .joystick-knob {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: cyan;
            border: 2px solid #fff;
            position: absolute;
            box-shadow: 0 0 10px cyan;
        }

        /* Shoot button styling */
        .shoot-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: red;
            border: 2px solid white;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px red;
            cursor: pointer;
            user-select: none;
            text-shadow: 0 0 5px #fff;
            pointer-events: auto;  /* Enable clicks on shoot button */
        }

        .shoot-btn span {
            font-size: 1rem;
            font-weight: bold;
            color: white;
            font-family: 'Space Mono', monospace;
        }

        /* Fade-in animation for game over message */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="canvas"></canvas>
        <div class="overlay"></div>
        <div class="scoreboard">
            <span id="scoreEl">Score: 0 | Lives: 3</span>
            <br>
            <span id="timerEl">Time: 02:00</span>
        </div>
        <div class="controls-container">
            <div class="joystick" id="joystick">
                <div class="joystick-knob" id="joystickKnob"></div>
            </div>
            <div class="shoot-btn" id="shootBtn">
                <span>SHOOT</span>
            </div>
        </div>
    </div>
    <script src="./index.js"></script>
</body>
</html>
