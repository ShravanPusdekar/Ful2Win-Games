<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./src/css/style.css">
  <link rel="icon" href="./src/img/mario.gif">
  <title>Super Mario</title>
</head>
<body>

  <div class="game-board">
    <div class="timer">Time: <span id="timer-value">2:00</span></div>
    <div class="score">Score: <span id="score-value">0</span></div>
    <img class="mario" src="./src/img/mario.gif" alt="mario">
    <img class="pipe" src="./src/img/pipe.png" alt="pipe">
    <img class="clouds" src="./src/img/clouds.png" alt="clouds">
  </div>

  <div class="game-over">
    <h1>Game Over</h1>
    <p class="final-score">Final Score: <span id="final-score-value">0</span></p>
  </div>
</body>
<script src="./src/js/main.js"></script>
</html>
